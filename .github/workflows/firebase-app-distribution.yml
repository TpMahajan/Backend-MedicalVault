name: Firebase App Distribution

# Only runs on an explicit manual trigger or a "medical-v*" tag push. Normal
# branch pushes (including merges to main) must never distribute a build to
# testers - an incomplete or unsigned build reaching testers is worse than a
# slightly slower release cadence.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "medical-v*"

# This repository (Backend-MedicalVault) hosts the canonical release tool,
# but the Flutter app itself lives in a sibling GitHub repository
# (MedicalVault). Both are checked out into a single workspace that mirrors
# the local development layout the release tool already assumes
# (MedicalVault/ and Backend-MedicalVault/ as siblings).
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Backend-MedicalVault
        uses: actions/checkout@v4
        with:
          path: Backend-MedicalVault

      - name: Checkout MedicalVault (Flutter app)
        uses: actions/checkout@v4
        with:
          repository: TpMahajan/MedicalVault
          ref: main
          path: MedicalVault

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Backend-MedicalVault/package-lock.json

      - name: flutter pub get
        working-directory: MedicalVault
        run: flutter pub get

      - name: Flutter tests
        working-directory: MedicalVault
        run: flutter test

      - name: Decode Android signing keystore
        working-directory: MedicalVault
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Release signing secrets are required before this workflow can build a distributable release APK. Firebase upload is blocked until they are configured."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Write key.properties
        working-directory: MedicalVault
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::One or more Android signing secrets (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are missing. Firebase upload is blocked until signing secrets are added."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build signed release APK
        working-directory: MedicalVault
        run: flutter build apk --release

      - name: Install backend dependencies
        working-directory: Backend-MedicalVault
        run: npm ci

      - name: Backend release-tool tests
        working-directory: Backend-MedicalVault
        run: npm test -- scripts/release-app-update.test.js scripts/firebase-distribution.test.js

      - name: Write Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set. Firebase upload is blocked until this secret is configured."
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Prepare, verify, and upload to Firebase App Distribution
        working-directory: Backend-MedicalVault
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_DISTRIBUTION_GROUPS }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_ANDROID_APP_ID:-}" ]; then
            echo "::error::FIREBASE_ANDROID_APP_ID secret is not set. Firebase upload is blocked until this secret is configured."
            exit 1
          fi
          npm run app-release:complete -- --skip-build

      - name: Remove Firebase service-account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Remove Android signing materials
        if: always()
        working-directory: MedicalVault
        run: rm -f android/app/release.keystore android/key.properties

      - name: Upload sanitized release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-release-report
          path: Backend-MedicalVault/release-reports/app-update/*.json
          if-no-files-found: warn
          retention-days: 90
